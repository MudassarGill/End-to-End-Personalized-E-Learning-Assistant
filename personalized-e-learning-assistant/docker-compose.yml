version: '3.8'

services:
  # ─── Backend API ───
  backend:
    build: ./backend
    container_name: elearning-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DATABASE_NAME=elearning_db
    depends_on:
      - mongo
    volumes:
      - ./ml_models:/app/ml_models
    restart: unless-stopped

  # ─── React Frontend ───
  frontend:
    build: ./frontend
    container_name: elearning-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000/api
    depends_on:
      - backend
    restart: unless-stopped

  # ─── MongoDB ───
  mongo:
    image: mongo:7.0
    container_name: elearning-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # ─── Prometheus (Metrics) ───
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: elearning-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      - backend
    restart: unless-stopped

  # ─── Grafana (Dashboards) ───
  grafana:
    image: grafana/grafana:10.2.0
    container_name: elearning-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  mongo_data:
  prometheus_data:
  grafana_data:
