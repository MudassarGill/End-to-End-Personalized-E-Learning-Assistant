# Prometheus Configuration — E-Learning Assistant
# Scrapes backend /metrics endpoint for API monitoring.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ─── Backend API Metrics ───
  - job_name: "elearning-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    scrape_interval: 10s

  # ─── Prometheus Self-Monitoring ───
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
