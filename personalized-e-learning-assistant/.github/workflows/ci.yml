name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend Lint & Test ───
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personalized-e-learning-assistant/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: personalized-e-learning-assistant/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-asyncio httpx

      - name: Lint with flake8
        run: |
          flake8 app/ --count --max-line-length=120 --statistics \
            --ignore=E501,W503,E402

      - name: Syntax check all Python files
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/utils.py
          python -m py_compile app/models/user.py
          python -m py_compile app/routes/upload.py
          python -m py_compile app/services/summarizer.py
          python -m py_compile app/services/keywords.py
          python -m py_compile app/services/quiz_generator.py
          python -m py_compile app/services/s3_upload.py
          python -m py_compile app/services/mlflow_tracking.py

  # ─── Frontend Build ───
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personalized-e-learning-assistant/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: personalized-e-learning-assistant/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build frontend
        run: npm run build
        env:
          CI: false
          REACT_APP_API_URL: http://localhost:8000/api

  # ─── Docker Build ───
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build \
            -t elearning-backend:${{ github.sha }} \
            personalized-e-learning-assistant/backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -t elearning-frontend:${{ github.sha }} \
            personalized-e-learning-assistant/frontend
